version: "3.9"  
  
services:  
  telegram-monitor:  
    build: .  
    container_name: telegram-monitor  
    restart: unless-stopped  
    ports:  
      - "8000:8000"  
    env_file:  
      - .env  
    environment:  
      # 覆盖 .env 中的 WEB_HOST，容器内必须监听 0.0.0.0  
      - WEB_HOST=0.0.0.0  
    volumes:  
      # 持久化 Telegram session 文件（登录状态）  
      - ./sessions:/app  
      # 持久化配置、日志、下载  
      - ./data:/app/data  
      - ./logs:/app/logs  
      - ./downloads:/app/downloads
